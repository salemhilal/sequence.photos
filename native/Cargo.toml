# The Mac app written in Rust with GPUI: an experiment, next to the Tauri app in
# src-tauri/. `core` is the project model and everything that doesn't draw a window (it
# builds for wasm32 too, so the website could use it one day); `mac` is the app.
# See docs/proposals/gpui-mac.md.

[workspace]
resolver = "3"
members = ["core", "mac"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Salem Hilal"]
repository = "https://github.com/salemhilal/sequence.photos"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
