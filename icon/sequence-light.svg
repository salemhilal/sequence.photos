    Mono 500, as outlines) on the top one, in the app's light neutrals. Drawn on the macOS
    icon grid: an 824 px tile on a 1024 px canvas. The tile is its own group so other
    shapes can be cut from this (full-bleed, rounded): see scripts/icons.mjs, which makes
    every icon from this file and its dark twin.
  -->
