# Production (main), deploy previews (pull requests), and branch deploys all use
# these settings. Tests run first; a failing test stops the deploy.
[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The app's Content Security Policy: only its own scripts, and network requests only to
# itself, Instagram's API, and Sequence's server (sequence-server, on workers.dev), or a
# server on this computer for development (Settings → Advanced). It guards the
# Instagram token the app keeps (see sequence-server's README). The Mac app has its own,
# in src-tauri/tauri.conf.json. Inline styles: React's style props need them.
[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data: https://graph.instagram.com https://*.workers.dev http://localhost:* http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The service worker and app manifest must always be fetched fresh, so updates are noticed.
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Removes the service worker that used to live here (see public/sw.js).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# The app lives at /app/ (its service worker's scope), so /app goes there too.
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301
