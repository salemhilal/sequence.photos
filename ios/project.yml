# The iPhone app, native (SwiftUI). `xcodegen generate` in this folder makes
# Sequence.xcodeproj (committed, so it opens in Xcode without XcodeGen). See README.md.
name: Sequence
options:
  bundleIdPrefix: io.salem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Sequence:
    type: application
    platform: iOS
    sources:
      - path: Sequence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.salem.SequencePhotosMobile
        PRODUCT_NAME: Sequence
        # iPhone only, for now.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sequence/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  SequenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SequenceTests
      - path: ../shared/fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - target: Sequence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.salem.SequencePhotosMobile.tests
  SequenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SequenceUITests
    dependencies:
      - target: Sequence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.salem.SequencePhotosMobile.uitests
        TEST_TARGET_NAME: Sequence
schemes:
  Sequence:
    build:
      targets:
        Sequence: all
        SequenceTests: [test]
        SequenceUITests: [test]
    test:
      targets:
        - SequenceTests
        - SequenceUITests
