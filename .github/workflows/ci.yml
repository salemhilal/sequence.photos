name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Committed .env files are public: no secrets in them.
      - run: node scripts/check-env.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # Type-checks everything (including tests) and builds the site.
      - run: npm run build
      - run: node scripts/check-web-bundle.mjs
      # The Mac app's web side (its native side needs macOS; see npm run test:app).
      - run: npm run app:ui:build
      - run: node scripts/check-app-bundle.mjs

  # The web app's interaction tests (e2e/), in Chromium and in WebKit, the Mac app's engine.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Sequence's server (server/): a Cloudflare Worker with its own tooling.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # The native iPhone app (ios/): its unit and UI tests in the Simulator.
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      # The project, from project.yml (with this runner's XcodeGen).
      - run: xcodegen generate
      - name: Test
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          xcodebuild test -scheme Sequence -destination "platform=iOS Simulator,name=$device" CODE_SIGNING_ALLOWED=NO -quiet
