name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Committed .env files are public: no secrets in them.
      - run: node scripts/check-env.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # Type-checks everything (including tests) and builds the site.
      - run: npm run build
      - run: node scripts/check-web-bundle.mjs
      # The Mac app's web side (its native side needs macOS; see npm run test:app).
      - run: npm run app:ui:build
      - run: node scripts/check-app-bundle.mjs

  # The web app's interaction tests (e2e/), in Chromium and in WebKit, the Mac app's engine.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Sequence's server (server/): a Cloudflare Worker with its own tooling.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
