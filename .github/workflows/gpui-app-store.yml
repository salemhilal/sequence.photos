# The Rust and GPUI Mac app (native/, see docs/proposals/gpui-mac.md): tests its core,
# builds the App Store package as native/scripts/app-store.sh does, and has Apple validate
# it. It never uploads unless run by hand with "upload" ticked. It uses the App Store
# workflow's secrets (see app-store.yml).

name: App Store (GPUI)

on:
  push:
    branches: [gpui-mac]
    paths:
      - 'native/**'
      - 'shared/goldens/**'
      - '.github/workflows/gpui-app-store.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect instead of only validating
        type: boolean
        default: false

concurrency:
  group: gpui-app-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number counts commits.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy, rustfmt
      - name: Check and test the core
        working-directory: native
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Install the signing certificates and profile
        env:
          CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          PROFILE: ${{ secrets.APP_STORE_PROFILE }}
          API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > src-tauri/embedded.provisionprofile
          echo "$API_KEY" > "$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"

      - name: Build and validate
        env:
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER }}
          UPLOAD: ${{ inputs.upload && '1' || '' }}
        run: APP_STORE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APP_STORE_API_KEY_ID.p8" native/scripts/app-store.sh
